services:
  django:
    build:
      context: .
      args:
        DJANGO_SETTINGS_MODULE: TestBot.settings.production
    container_name: django-bot
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=TestBot.settings.production
      - RUN_MIGRATIONS=1
    networks:
      - bot-network
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    command: >
      gunicorn TestBot.asgi:application
          -k uvicorn.workers.UvicornWorker
          --workers 3
          --worker-connections 1000
          --bind 0.0.0.0:8000 
          --timeout 15
          --keep-alive 2
          --max-requests 1000
          --max-requests-jitter 100

networks:
  bot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-data: