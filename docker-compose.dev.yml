services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    container_name: bot-db

  django:
    build:
      context: .
      args:
        DJANGO_SETTINGS_MODULE: TestBot.settings.local
    volumes:
      - ./:/app
    container_name: bot-django
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=TestBot.settings.local
      - RUN_MIGRATIONS=1
    depends_on:
      - db
    command: python manage.py runserver 0.0.0.0:8000

  bot:
    build: .
    command: python -m bot.main
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: TestBot.settings.local
    depends_on:
      - db


volumes:
  postgres_data: